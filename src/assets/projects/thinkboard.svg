<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329" />
      <stop offset="50%" stop-color="#24173d" />
      <stop offset="100%" stop-color="#100b1d" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="tbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#tbBg)" />

  <circle cx="130" cy="110" r="140" fill="#8b5cf6" opacity="0.16" filter="url(#tbGlow)" />
  <circle cx="480" cy="240" r="150" fill="#f59e0b" opacity="0.14" filter="url(#tbGlow)" />

  <!-- App Window -->
  <rect x="65" y="45" width="470" height="290" rx="14" fill="#130e21" fill-opacity="0.9" stroke="#9333ea" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="65" y="45" width="470" height="42" rx="14" fill="#1e1633" />
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="106" cy="66" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="122" cy="66" r="5" fill="#10b981" opacity="0.8" />
  <text x="145" y="71" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14">📝 ThinkBoard Notes</text>
  <text x="310" y="70" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11">Cloud-Synced Workspace</text>

  <!-- Left Sidebar Mockup -->
  <rect x="75" y="97" width="115" height="195" rx="8" fill="#18112a" />
  <text x="88" y="122" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">FOLDERS</text>
  <rect x="83" y="132" width="98" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.25" />
  <text x="92" y="148" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="11">⭐ Pinned (4)</text>
  <text x="92" y="174" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">💡 Ideas (12)</text>
  <text x="92" y="200" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">🚀 Projects (8)</text>
  <text x="92" y="226" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">📚 Learning (15)</text>

  <!-- Pinned Note Card 1 -->
  <rect x="202" y="102" width="155" height="185" rx="10" fill="#201738" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
  <circle cx="218" cy="120" r="5" fill="#f59e0b" />
  <text x="230" y="124" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">System Architecture</text>
  <text x="215" y="146" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Design modular REST</text>
  <text x="215" y="162" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">controllers with JWT auth</text>
  <text x="215" y="178" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">&amp; encrypted payloads.</text>
  <rect x="215" y="250" width="55" height="18" rx="4" fill="#8b5cf6" fill-opacity="0.3" />
  <text x="223" y="263" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">#backend</text>
  <rect x="278" y="250" width="45" height="18" rx="4" fill="#f59e0b" fill-opacity="0.3" />
  <text x="285" y="263" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">#high</text>

  <!-- Note Card 2 -->
  <rect x="368" y="102" width="155" height="185" rx="10" fill="#201738" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.2" />
  <text x="382" y="124" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">Sprint Goals 🎯</text>
  <text x="382" y="146" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">• Refactor UI components</text>
  <text x="382" y="165" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">• Markdown shortcuts</text>
  <text x="382" y="184" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">• Instant search indexing</text>
  <rect x="382" y="250" width="55" height="18" rx="4" fill="#10b981" fill-opacity="0.3" />
  <text x="390" y="263" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">#active</text>

  <!-- Bottom Bar -->
  <rect x="65" y="300" width="470" height="35" fill="#150e26" />
  <text x="85" y="322" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">React • Node.js • Express • MongoDB • JWT Auth • Markdown Support</text>
</svg>
