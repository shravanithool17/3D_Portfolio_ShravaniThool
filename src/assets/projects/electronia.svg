<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="elecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0d2547" />
      <stop offset="100%" stop-color="#05101f" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112d54" />
      <stop offset="100%" stop-color="#0c1e38" />
    </linearGradient>
    <filter id="glowElec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#elecBg)" />

  <!-- Ambient light -->
  <circle cx="100" cy="90" r="130" fill="#06b6d4" opacity="0.15" filter="url(#glowElec)" />
  <circle cx="500" cy="180" r="160" fill="#3b82f6" opacity="0.18" filter="url(#glowElec)" />

  <!-- Circuit grid pattern -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 50 100 H 200 V 220 H 350" fill="none" />
    <circle cx="200" cy="220" r="4" fill="#38bdf8" />
    <path d="M 400 60 V 150 H 550" fill="none" />
    <circle cx="400" cy="150" r="4" fill="#38bdf8" />
    <path d="M 120 320 H 280 V 260" fill="none" />
    <circle cx="280" cy="260" r="4" fill="#38bdf8" />
  </g>

  <!-- Main Storefront Mockup -->
  <rect x="65" y="45" width="470" height="290" rx="14" fill="#081b33" fill-opacity="0.9" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="65" y="45" width="470" height="42" rx="14" fill="#0f2647" />
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="106" cy="66" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="122" cy="66" r="5" fill="#10b981" opacity="0.8" />
  
  <!-- Title / Logo -->
  <text x="145" y="71" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">⚡ ElectrOnia</text>
  <text x="245" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Multi-Vendor Marketplace</text>

  <!-- Razorpay / Verified Tag -->
  <rect x="420" y="55" width="95" height="22" rx="11" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
  <text x="430" y="70" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">🛡️ Razorpay</text>

  <!-- Product Card 1 -->
  <rect x="85" y="105" width="130" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e3a63" stroke-width="1" />
  <rect x="95" y="115" width="110" height="80" rx="8" fill="#0a192f" />
  <text x="135" y="160" font-size="30">💻</text>
  <text x="95" y="212" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">MacBook Pro M3</text>
  <text x="95" y="228" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">₹ 1,49,900</text>
  <rect x="95" y="242" width="110" height="24" rx="6" fill="url(#cyanBlue)" />
  <text x="125" y="258" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">Add to Cart</text>

  <!-- Product Card 2 -->
  <rect x="235" y="105" width="130" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e3a63" stroke-width="1" />
  <rect x="245" y="115" width="110" height="80" rx="8" fill="#0a192f" />
  <text x="285" y="160" font-size="30">🎧</text>
  <text x="245" y="212" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">Sony WH-1000XM5</text>
  <text x="245" y="228" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">₹ 29,990</text>
  <rect x="245" y="242" width="110" height="24" rx="6" fill="url(#cyanBlue)" />
  <text x="275" y="258" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">Add to Cart</text>

  <!-- Architecture / Test Badge Box -->
  <rect x="385" y="105" width="130" height="175" rx="10" fill="#07172b" stroke="#0284c7" stroke-width="1" />
  <text x="398" y="130" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">ENGINEERING</text>
  <text x="398" y="152" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ 340+ Jest Tests</text>
  <text x="398" y="172" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ Modular Monolith</text>
  <text x="398" y="192" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ HMAC Webhooks</text>
  <text x="398" y="212" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ Append Ledger</text>
  <text x="398" y="232" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ Vendor Portals</text>
  <rect x="398" y="248" width="105" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="408" y="261" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">PRODUCTION READY</text>

  <!-- Bottom info bar -->
  <rect x="65" y="300" width="470" height="35" rx="0" fill="#09182d" />
  <text x="85" y="322" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">React 19 • Express 5 • MongoDB Atlas • Razorpay • RBAC</text>
</svg>
