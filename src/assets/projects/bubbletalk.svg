<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#2a1458" />
      <stop offset="100%" stop-color="#0f0728" />
    </linearGradient>
    <linearGradient id="bubble1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bubble2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="120" cy="100" r="140" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />
  <circle cx="500" cy="280" r="160" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  <circle cx="480" cy="80" r="90" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Chat Window Mockup -->
  <rect x="70" y="45" width="460" height="290" rx="14" fill="#130924" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="70" y="45" width="460" height="42" rx="14" fill="#1e1138" fill-opacity="0.9" />
  <circle cx="95" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="112" cy="66" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="129" cy="66" r="5" fill="#10b981" opacity="0.8" />
  
  <!-- Header Title -->
  <circle cx="170" cy="66" r="12" fill="url(#bubble1)" />
  <text x="192" y="70" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">BubbleTalk • Real-Time</text>
  <circle cx="340" cy="66" r="4" fill="#22c55e" />
  <text x="350" y="70" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="11">Online</text>

  <!-- Incoming Message Bubble -->
  <rect x="95" y="105" width="220" height="48" rx="14" fill="#241442" stroke="#4c1d95" stroke-width="1" />
  <text x="112" y="134" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Hey Shravani! Socket connected ⚡</text>

  <!-- Outgoing Message Bubble -->
  <rect x="270" y="165" width="235" height="52" rx="14" fill="url(#bubble1)" />
  <text x="286" y="196" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12.5">Voice note &amp; GIF sent seamlessly! 🎙️</text>

  <!-- Audio Waveform Pill -->
  <rect x="95" y="230" width="270" height="46" rx="14" fill="#1b1233" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="120" cy="253" r="13" fill="#8b5cf6" />
  <polygon points="117,247 127,253 117,259" fill="#ffffff" />
  <!-- Wave bars -->
  <rect x="145" y="247" width="3" height="12" rx="1.5" fill="#c084fc" />
  <rect x="153" y="242" width="3" height="22" rx="1.5" fill="#a855f7" />
  <rect x="161" y="245" width="3" height="16" rx="1.5" fill="#c084fc" />
  <rect x="169" y="238" width="3" height="30" rx="1.5" fill="#e879f9" />
  <rect x="177" y="243" width="3" height="20" rx="1.5" fill="#a855f7" />
  <rect x="185" y="248" width="3" height="10" rx="1.5" fill="#c084fc" />
  <rect x="193" y="241" width="3" height="24" rx="1.5" fill="#e879f9" />
  <rect x="201" y="246" width="3" height="14" rx="1.5" fill="#a855f7" />
  <rect x="209" y="243" width="3" height="20" rx="1.5" fill="#c084fc" />
  <text x="235" y="257" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">0:14 / 48kHz</text>

  <!-- Floating Reaction Badges -->
  <g filter="url(#glow)">
    <rect x="420" y="222" width="58" height="26" rx="13" fill="#1e1138" stroke="#ec4899" stroke-width="1" />
    <text x="430" y="239" font-size="13">🔥 12</text>
  </g>
  <g>
    <rect x="485" y="222" width="36" height="26" rx="13" fill="#1e1138" stroke="#8b5cf6" stroke-width="1" />
    <text x="494" y="239" font-size="13">❤️</text>
  </g>

  <!-- Bottom Bar Badge -->
  <rect x="70" y="300" width="460" height="35" rx="0" fill="#160c2b" />
  <text x="95" y="322" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">MERN Stack • Socket.io • DaisyUI 32 Themes • Cloudinary</text>
</svg>
