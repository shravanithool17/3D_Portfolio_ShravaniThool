<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#080e21" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48cae4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="bcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bcBg)" />

  <circle cx="120" cy="80" r="140" fill="#00b4d8" opacity="0.14" filter="url(#bcGlow)" />
  <circle cx="490" cy="220" r="150" fill="#10b981" opacity="0.12" filter="url(#bcGlow)" />

  <!-- App Window -->
  <rect x="65" y="45" width="470" height="290" rx="14" fill="#0d1b2a" fill-opacity="0.9" stroke="#0077b6" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="65" y="45" width="470" height="42" rx="14" fill="#102035" />
  <circle cx="90" cy="66" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="106" cy="66" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="122" cy="66" r="5" fill="#10b981" opacity="0.8" />
  <text x="145" y="71" fill="#48cae4" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14">📊 Blackcoffer Analytics</text>
  <text x="330" y="70" fill="#90e0ef" font-family="system-ui, -apple-system, sans-serif" font-size="11">Data Insights Dashboard</text>

  <!-- Metric Badges Row -->
  <rect x="85" y="100" width="100" height="50" rx="8" fill="#142842" stroke="#1b3a5e" stroke-width="1" />
  <text x="96" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">AVG INTENSITY</text>
  <text x="96" y="140" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">18.4 <tspan font-size="10" fill="#34d399">↑ 4%</tspan></text>

  <rect x="195" y="100" width="100" height="50" rx="8" fill="#142842" stroke="#1b3a5e" stroke-width="1" />
  <text x="206" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">LIKELIHOOD</text>
  <text x="206" y="140" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">3.72</text>

  <rect x="305" y="100" width="100" height="50" rx="8" fill="#142842" stroke="#1b3a5e" stroke-width="1" />
  <text x="316" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">RELEVANCE</text>
  <text x="316" y="140" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">4.18</text>

  <rect x="415" y="100" width="100" height="50" rx="8" fill="#142842" stroke="#1b3a5e" stroke-width="1" />
  <text x="426" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">COUNTRIES</text>
  <text x="426" y="140" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16">48+</text>

  <!-- Area Chart Box -->
  <rect x="85" y="162" width="280" height="125" rx="8" fill="#12233a" stroke="#1e3a63" stroke-width="1" />
  <text x="98" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5">Topic Intensity Trend (2016 - 2026)</text>
  
  <!-- Wave / Area chart -->
  <path d="M 98 260 L 130 230 L 165 245 L 205 205 L 245 220 L 285 190 L 325 210 L 350 185 L 350 265 L 98 265 Z" fill="url(#chartGrad)" />
  <path d="M 98 260 L 130 230 L 165 245 L 205 205 L 245 220 L 285 190 L 325 210 L 350 185" fill="none" stroke="#00b4d8" stroke-width="2.5" />
  <circle cx="205" cy="205" r="4" fill="#38bdf8" />
  <circle cx="285" cy="190" r="4" fill="#38bdf8" />
  <circle cx="350" cy="185" r="4" fill="#34d399" />

  <!-- Bar Breakdown Box -->
  <rect x="375" y="162" width="140" height="125" rx="8" fill="#12233a" stroke="#1e3a63" stroke-width="1" />
  <text x="388" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5">Top Sectors</text>
  <rect x="388" y="196" width="95" height="9" rx="4.5" fill="#38bdf8" />
  <rect x="388" y="213" width="75" height="9" rx="4.5" fill="#818cf8" />
  <rect x="388" y="230" width="85" height="9" rx="4.5" fill="#34d399" />
  <rect x="388" y="247" width="60" height="9" rx="4.5" fill="#fbbf24" />
  <rect x="388" y="264" width="45" height="9" rx="4.5" fill="#f43f5e" />

  <!-- Bottom info bar -->
  <rect x="65" y="300" width="470" height="35" fill="#0c1726" />
  <text x="85" y="322" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">React • Chart.js / D3 • Node.js • Express • MongoDB • Dynamic Multi-Filters</text>
</svg>
